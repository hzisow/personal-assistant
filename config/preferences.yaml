# ─────────────────────────────────────────────────────────────────────────────
# Personal Assistant — preferences (source of truth)
# Edit this file freely: the assistant re-reads it on every run.
# You can also just reply to a morning brief email or tell Claude in a session —
# it will apply the change here and note it in the next brief.
# ─────────────────────────────────────────────────────────────────────────────

user:
  name: Henry
  email: hzisow@gmail.com
  timezone: America/New_York
  location: "Boston, MA"

brief:
  ready_by_local: "07:00"        # brief must be delivered by this local time
  generation_starts_local: "06:40"
  dashboard_style: >-            # user-chosen 2026-07-17: keep this design system when regenerating
    Airbnb-inspired: white ground, blue accent #1E6AE1 (dark: #6EA1F0), 16px-radius
    bordered cards with hover lift, sticky navbar (sun logomark + segmented date pill +
    avatar), single friendly sans stack, generous whitespace, urgency red #C13515 only
    for truly time-sensitive items. Change content daily, never the design, unless asked.
  delivery:
    email: true                  # PRIMARY — Henry confirmed 2026-07-30 "do gmails each day". Must send daily.
    email_gmail_fallback: false  # 2026-08-22 Henry replied "stop" to the brief (which offered "reply stop to turn
                                 # off the fallback"). DO NOT send the brief via the Gmail-connector send_message.
                                 # While Zapier is out this means NO brief email goes out — dashboard-only delivery,
                                 # surfaced to Henry (not a silent pause; he asked for it). Re-enable ONLY if Henry
                                 # says so. When Zapier quota is restored, the NORMAL Zapier email path (gmail_send_email)
                                 # may resume — that is not "the fallback" — but confirm with Henry first given the "stop".
    dashboard: true              # private artifact page, stable URL (see state/state.json)
    push: false                  # 2026-08-01 Henry: stop notifying me when the brief is sent
    quiet_chat: true             # 2026-08-01 Henry: on SCHEDULED runs, deliver silently — no post-send chat
                                 # summary/recap in the session (that pings him). The email IS the notification.
                                 # Exceptions: DO speak up if a send fails, a source is broken, or something
                                 # needs Henry. Quiet applies to interactive turns only when he's not waiting.
    # 2026-07-30: delivery was accidentally paused Jul 17–29 (send steps declined once, then over-paused).
    # NEVER silently pause outbound EMAIL delivery again — if a send is blocked, surface it and keep trying;
    # email is how Henry actually receives the brief. "Quiet" = no chat ping on success, NOT skipping the email.
  sections: [schedule, email, tasks, follow_ups, weather, news]

calendars:
  # role: schedule → full treatment (timeline, conflicts, prep)
  # role: context  → mentioned only when something falls on today
  - { id: "hzisow@gmail.com",                                                                  name: "Personal",                     role: schedule }
  - { id: "253m45rq351c8lue5a46p9j6orog27ui@import.calendar.google.com",                       name: "Canvas (school)",              role: schedule }
  - { id: "classroom115736193776007257542@group.calendar.google.com",                          name: "Massachusetts DECA",           role: schedule }
  - { id: "classroom104226409099884474407@group.calendar.google.com",                          name: "2026 State Officer Candidates", role: schedule }
  - { id: "1807142b75b6821d9088bb7a10c0a9764e43da05c4cdce3fc9b4161456d56fe2@group.calendar.google.com", name: "Team 68",              role: schedule }
  - { id: "7267cc382e50cb4306b21af7639b56cdebdefcac1c9dc94b9f36dc54b026dea7@group.calendar.google.com", name: "Recall Reviews",       role: schedule }
  - { id: "5npcs8eoemv7bvhftll90nqljgsua2i6@import.calendar.google.com",                       name: "Jewish Holidays",              role: context }
  - { id: "en.usa#holiday@group.v.calendar.google.com",                                        name: "US Holidays",                  role: context }

email_triage:
  mode: learned                  # learned | important-flag | rules-only
  lookback_days: 3
  max_items: 8
  rules_file: config/email-rules.yaml
  # Replying to a morning-brief email is a supported feedback channel:
  # each run checks replies and applies instructions found there.

tasks:
  provider: google_tasks         # via Zapier (GoogleTasksCLIAPI)
  status: connected              # Henry authorized 2026-08-01 — runs pull live tasks now
  auth_url: "https://mcp.zapier.com/mcp/servers/db7a6288-3667-4e21-98ed-119d76d9c9da/app-auth/GoogleTasksCLIAPI"  # kept for re-auth if it ever drops
  # Henry organizes by priority + a school "Summer Work" list. Pull open tasks from each list
  # (overdue/due-today first). Discovered 2026-08-01; ids are stable. "My Tasks" is currently empty.
  lists:
    - { id: "dmVOLUVTcF9MbGZBdVBSUA", name: "High Priority" }
    - { id: "dWhIMmZPSXlmZnMzcXFVZQ", name: "Medium Priority" }
    - { id: "aVo3TGJtcUc5M2NZZzN1Mw", name: "Low Priority" }
    - { id: "RlpHY2ladE82UTFCbjNGNw", name: "Summer Work" }
    - { id: "MTY2NTcwNDcyMzk3NDQwNDM2MDI6MDow", name: "My Tasks" }

weather:
  location: "Newton/Boston, MA"
  coordinates: { lat: 42.337, lon: -71.209 }
  units: imperial
  source: zapier_weather   # Weather by Zapier (WeatherCLIAPI) — no auth needed
  fallback: web_search     # wttr.in and forecast.weather.gov are proxy-blocked here

news:
  topics:
    - "Business & markets"
    - "Tech & AI"
    - "US & world headlines"
  max_per_topic: 3

# ─────────────────────────────────────────────────────────────────────────────
# HARD BOUNDARIES — set by Henry on 2026-07-17. Do not relax without an
# explicit, direct instruction from Henry in his own words.
# ─────────────────────────────────────────────────────────────────────────────
boundaries:
  proactive_scheduling: false    # NEVER create, modify, or delete calendar events
  send_email: brief_only         # the ONLY outbound email is the morning brief to user.email
  gmail_writes: none             # no labeling, archiving, or deleting in Gmail
  artifact_visibility: private   # never share the dashboard artifact
  # Surfacing "3 people are waiting on you to pick a time" in triage is fine —
  # that is information. Acting on it is not.
